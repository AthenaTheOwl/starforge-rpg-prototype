name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  godot-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - run: python tools/check_release.py --clean --fail-on-generated

  godot-native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.1.1
      - name: Download and verify official portable Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/starforge-godot"
          cd "$RUNNER_TEMP/starforge-godot"
          curl --fail --location --retry 2 --output godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum --check --strict
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          touch _sc_
          ./Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Native GUT and deterministic gameplay smoke
        run: python tools/check_release.py --clean --fail-on-generated --require-godot --godot "$RUNNER_TEMP/starforge-godot/Godot_v4.7.2-stable_linux.x86_64"
